const W = 400, H = 240;
canvas.width = W;
canvas.height = H;

const T = 16, ROWS = 15, COLS = 220;
let map = [], enemies = [], particles = [];
let camX = 0, score = 0, coins = 0, time = 400, timeTick = 0;
let gameState = 'start';
const player = { x:48, y:12*T, vx:0, vy:0, w:14, h:20, onGround:false, frame:0, ft:0, dead:false, win:false };

function buildLevel() {
  map = [];
  for (let x = 0; x < COLS; x++) { map[x] = new Array(ROWS).fill(0); }
  for (let x = 0; x < COLS; x++) { map[x][13]=1; map[x][14]=1; }
  [[68,70],[86,88],[152,155]].forEach(([a,b])=>{ for(let x=a;x<=b;x++){map[x][13]=0;map[x][14]=0;} });
  [[16,9],[21,9],[22,5],[23,9],[78,9],[94,5],[106,9],[107,9],[130,9],[170,9]].forEach(([x,y])=>{ if(x<COLS) map[x][y]=2; });
  [[20,9],[22,9],[24,9],[77,9],[79,9],[80,9],[100,5],[101,5],[102,5],[103,5],[104,5],[105,5],[106,5],[107,5],[129,9],[131,9],[168,9],[169,9],[171,9]].forEach(([x,y])=>{ if(x<COLS) map[x][y]=3; });
  [[28,2,11],[38,3,10],[46,4,9],[57,4,9],[163,2,11],[179,2,11]].forEach(([x,h,topY])=>{
    for(let dy=topY;dy<=12;dy++){ if(x<COLS) map[x][dy]=4; if(x+1<COLS) map[x+1][dy]=4; }
  });
  for(let i=0;i<8;i++) for(let j=0;j<=i;j++){ let x=190+i,y=12-j; if(x<COLS&&y>=0) map[x][y]=5; }
  for(let y=4;y<=12;y++){ if(199<COLS) map[199][y]=6; }
}

function spawnEnemies() {
  enemies = [];
  [40,51,52,80,82,97,98,114,115,124,125,128,174,175].forEach(x=>{
    enemies.push({x:x*T, y:12*T, vx:-0.5, alive:true, squish:0});
  });
}

function solid(tx,ty) {
  if(tx<0||tx>=COLS) return ty>=13;
  if(ty<0) return false;
  if(ty>=ROWS) return true;
  let t=map[tx][ty];
  return t>=1 && t<=5;
}

function hitBlock(tx,ty) {
  if(ty<0||ty>=ROWS||tx<0||tx>=COLS) return;
  let t=map[tx][ty];
  if(t===2){ map[tx][ty]=7; coins++; score+=200; particles.push({x:tx*T+4,y:ty*T,vy:-4,life:30,type:'coin'}); }
  else if(t===3){
    map[tx][ty]=0;
    for(let i=0;i<4;i++) particles.push({x:tx*T+4+((i%2)*8),y:ty*T+4,vx:(i%2===0?-1:1)*(1+Math.random()*2),vy:-3-Math.random()*3,life:40,type:'debris'});
  }
}

function resetGame() {
  player.x=48; player.y=12*T; player.vx=0; player.vy=0;
  player.dead=false; player.onGround=false; player.win=false;
  camX=0; score=0; coins=0; time=400; timeTick=0; particles=[];
  buildLevel(); spawnEnemies();
}

buildLevel();

let jumpHeld = false;
function onPress() {
  if(gameState==='start'){ gameState='play'; resetGame(); return; }
  if(gameState==='dead'||gameState==='win'){ gameState='start'; return; }
  if(gameState==='play'&&player.onGround&&!player.dead){ player.vy=-6.5; player.onGround=false; jumpHeld=true; }
}
function onRelease(){ jumpHeld=false; }
document.addEventListener('touchstart',e=>{e.preventDefault();onPress();},{passive:false});
document.addEventListener('touchend',e=>{e.preventDefault();onRelease();},{passive:false});
document.addEventListener('mousedown',onPress);
document.addEventListener('mouseup',onRelease);
document.addEventListener('keydown',e=>{if(e.code==='Space')onPress();});
document.addEventListener('keyup',e=>{if(e.code==='Space')onRelease();});

function update() {
  if(gameState!=='play') return;
  timeTick++;
  if(timeTick>=24){timeTick=0;time--;if(time<=0){player.dead=true;player.vy=-5;}}
  if(player.dead){player.vy+=0.3;player.y+=player.vy;if(player.y>H+100)gameState='dead';return;}
  if(player.win){player.x+=1.5;if(player.x>200*T)gameState='win';return;}
  player.vx=1.8;
  player.vy+=0.35;
  if(jumpHeld&&player.vy<0)player.vy-=0.15;
  if(player.vy>8)player.vy=8;
  player.x+=player.vx;
  let px=player.x,py=player.y,pw=player.w,ph=player.h;
  let rtx=Math.floor((px+pw)/T),tyA=Math.floor(py/T),tyB=Math.floor((py+ph-1)/T);
  for(let ty=tyA;ty<=tyB;ty++){if(solid(rtx,ty)){player.x=rtx*T-pw;break;}}
  player.y+=player.vy; player.onGround=false;
  px=player.x; py=player.y;
  let txL=Math.floor(px/T),txR=Math.floor((px+pw-1)/T);
  if(player.vy>=0){
    let bty=Math.floor((py+ph)/T);
    for(let tx=txL;tx<=txR;tx++){if(solid(tx,bty)){player.y=bty*T-ph;player.vy=0;player.onGround=true;break;}}
  }else{
    let tty=Math.floor(py/T);
    for(let tx=txL;tx<=txR;tx++){if(solid(tx,tty)){player.y=(tty+1)*T;player.vy=0.5;hitBlock(tx,tty);break;}}
  }
  if(player.y>ROWS*T+20){player.dead=true;player.vy=-5;}
  player.ft++;
  if(player.ft>=6){player.ft=0;player.frame=(player.frame+1)%3;}
  enemies.forEach(e=>{
    if(!e.alive){if(e.squish>0)e.squish--;return;}
    e.x+=e.vx;
    let etx=Math.floor((e.x+(e.vx>0?14:0))/T),ety=Math.floor((e.y+8)/T);
    if(solid(etx,ety))e.vx*=-1;
    if(e.y>ROWS*T+20)e.alive=false;
    if(!player.dead){
      let dx=Math.abs(player.x+7-e.x-8),dy=Math.abs(player.y+10-e.y-8);
      if(dx<14&&dy<18){
        if(player.vy>0&&player.y+ph<e.y+10){e.alive=false;e.squish=30;player.vy=-5;score+=100;}
        else{player.dead=true;player.vy=-5;}
      }
    }
  });
  let ftx=Math.floor((player.x+7)/T);
  if(ftx===199&&!player.win){player.win=true;score+=5000;}
  particles.forEach(p=>{p.life--;if(p.type==='coin'){p.y+=p.vy;p.vy+=0.2;}else{p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;}});
  particles=particles.filter(p=>p.life>0);
  let target=player.x-W/3;
  if(target<camX)target=camX;
  camX+=(target-camX)*0.1;
  if(camX<0)camX=0;
}

function drawRoundRect(x,y,w,h,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  ctx.fill();
}

function drawTile(tx,ty) {
  let t=map[tx][ty];
  if(t===0)return;
  let x=Math.floor(tx*T-camX), y=ty*T;
  if(x<-T||x>W+T)return;
  if(t===1){
    drawRoundRect(x,y,T,T,2,'#c84c0c');
    ctx.fillStyle='#e09050';
    ctx.fillRect(x+2,y+2,6,6);
    ctx.fillRect(x+9,y+2,6,6);
    ctx.fillRect(x+5,y+9,6,6);
  }else if(t===2){
    drawRoundRect(x,y,T,T,2,'#e09050');
    ctx.fillStyle='#000';
    ctx.fillRect(x,y,T,1);ctx.fillRect(x,y,1,T);
    ctx.fillRect(x,y+15,T,1);ctx.fillRect(x+15,y,1,T);
    ctx.fillStyle='#fff';
    ctx.fillRect(x+5,y+3,6,2);ctx.fillRect(x+9,y+5,2,3);
    ctx.fillRect(x+7,y+8,2,2);ctx.fillRect(x+7,y+11,2,2);
  }else if(t===3){
    drawRoundRect(x,y,T,T,2,'#c84c0c');
    ctx.fillStyle='#a03000';
    ctx.fillRect(x,y+7,T,1);ctx.fillRect(x+7,y,1,7);
    ctx.fillRect(x+3,y+8,1,8);ctx.fillRect(x+11,y+8,1,8);
  }else if(t===4){
    drawRoundRect(x,y,T,T,2,'#00a800');
    ctx.fillStyle='#008000';ctx.fillRect(x,y,3,T);
    ctx.fillStyle='#58d858';ctx.fillRect(x+5,y,3,T);
    if(ty===0||(ty>0&&map[tx][ty-1]!==4)){
      drawRoundRect(x-2,y,T+4,4,1,'#00a800');
      ctx.fillStyle='#008000';ctx.fillRect(x-2,y,3,4);
      ctx.fillStyle='#58d858';ctx.fillRect(x+3,y,3,4);
    }
  }else if(t===5){
    drawRoundRect(x,y,T,T,2,'#8c8c8c');
    ctx.fillStyle='#b0b0b0';
    ctx.fillRect(x+1,y+1,14,6);ctx.fillRect(x+1,y+9,6,6);
    ctx.fillStyle='#505050';ctx.fillRect(x,y+15,T,1);ctx.fillRect(x+15,y,1,T);
  }else if(t===6){
    ctx.fillStyle='#808080';ctx.fillRect(x+7,y,2,T);
    if(ty===4){
      ctx.fillStyle='#00a800';ctx.fillRect(x-8,y,15,10);
      ctx.fillStyle='#fff';ctx.fillRect(x-4,y+3,4,4);
    }
  }else if(t===7){
    drawRoundRect(x,y,T,T,2,'#886444');
    ctx.fillStyle='#000';
    ctx.fillRect(x,y,T,1);ctx.fillRect(x,y,1,T);
    ctx.fillRect(x,y+15,T,1);ctx.fillRect(x+15,y,1,T);
  }
}

function drawPlayer(sx,sy,dead) {
  let x=Math.floor(sx-camX), y=Math.floor(sy);
  if(dead){
    ctx.globalAlpha=0.5;
    ctx.drawImage(playerImg, x-2, y-6, 18, 26);
    ctx.globalAlpha=1;
    return;
  }
  // 璺戞鍔ㄧ敾 - 杞诲井涓婁笅寮硅烦
  let bounce = player.onGround ? Math.sin(player.frame * Math.PI / 1.5) * 1 : 0;
  ctx.drawImage(playerImg, x-2, y-6+bounce, 18, 26);
}

function drawGoomba(e) {
  let x=Math.floor(e.x-camX),y=Math.floor(e.y);
  if(!e.alive&&e.squish>0){
    drawRoundRect(x,y+12,16,4,1,'#c84c0c');return;
  }
  if(!e.alive)return;
  drawRoundRect(x+2,y,12,8,2,'#c84c0c');
  drawRoundRect(x,y+4,16,6,2,'#c84c0c');
  ctx.fillStyle='#fff';
  ctx.fillRect(x+3,y+3,4,4);ctx.fillRect(x+9,y+3,4,4);
  ctx.fillStyle='#000';
  ctx.fillRect(x+5,y+4,2,3);ctx.fillRect(x+9,y+4,2,3);
  drawRoundRect(x+1,y+10,5,6,1,'#a03000');
  drawRoundRect(x+10,y+10,5,6,1,'#a03000');
}

function drawBG() {
  // 娓愬彉澶╃┖
  let grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#87CEEB');
  grad.addColorStop(1,'#E0F6FF');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
  
  // 浜戞湹
  [[100,30],[300,50],[600,25],[900,45],[1300,35],[1700,50],[2200,30],[2700,40],[3200,25]].forEach(([cx,cy])=>{
    let sx=Math.floor(cx-camX*0.3);
    if(sx>-40&&sx<W+40){
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(sx+8,cy+4,6,0,Math.PI*2);
      ctx.arc(sx+4,cy+6,5,0,Math.PI*2);
      ctx.arc(sx+12,cy+6,5,0,Math.PI*2);
      ctx.fill();
    }
  });
  
  // 灞变笜
  [[0,3],[400,2],[800,4],[1400,2],[2000,3],[2600,2],[3200,4]].forEach(([hx,hs])=>{
    let sx=Math.floor(hx-camX*0.5);
    if(sx>-80&&sx<W+80){
      let baseY=13*T;
      ctx.fillStyle='#00a800';
      ctx.beginPath();
      ctx.moveTo(sx,baseY);
      for(let i=0;i<=hs*4;i++){
        let t=i/(hs*4);
        let h=Math.sin(t*Math.PI)*hs*8;
        ctx.lineTo(sx+i,baseY-h-4);
      }
      ctx.lineTo(sx+hs*4,baseY);
      ctx.closePath();
      ctx.fill();
    }
  });
  
  // 鐏屾湪
  [[150,1],[500,2],[950,1],[1500,2],[2100,1],[2800,2]].forEach(([bx,bs])=>{
    let sx=Math.floor(bx-camX*0.8);
    if(sx>-30&&sx<W+30){
      let by=13*T-4;
      ctx.fillStyle='#00a800';
      ctx.beginPath();
      ctx.arc(sx+8,by+4,6,0,Math.PI*2);
      ctx.arc(sx+4,by+6,5,0,Math.PI*2);
      ctx.arc(sx+12,by+6,5,0,Math.PI*2);
      ctx.fill();
    }
  });
}

function drawHUD() {
  ctx.fillStyle='#fff';
  ctx.font='bold 10px Arial, sans-serif';
  ctx.textAlign='left';
  ctx.shadowColor='rgba(0,0,0,0.5)';
  ctx.shadowBlur=2;
  ctx.shadowOffsetX=1;
  ctx.shadowOffsetY=1;
  ctx.fillText('SCORE',20,12);
  ctx.fillText(String(score).padStart(6,'0'),20,24);
  ctx.fillText('\u00d7'+coins,158,24);
  ctx.fillText('WORLD',260,12);
  ctx.fillText(' 1-1',260,24);
  ctx.fillText('TIME',340,12);
  ctx.fillText(' '+time,340,24);
  ctx.shadowBlur=0;
  ctx.shadowOffsetX=0;
  ctx.shadowOffsetY=0;
}

function draw() {
  ctx.clearRect(0,0,W,H);
  if(gameState==='start'){
    drawBG();
    for(let x=0;x<25;x++){drawTile(x,13);drawTile(x,14);}
    
    // 鏍囬
    ctx.fillStyle='#e00000';
    ctx.font='bold 24px Arial, sans-serif';
    ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,0.3)';
    ctx.shadowBlur=4;
    ctx.shadowOffsetX=2;
    ctx.shadowOffsetY=2;
    ctx.fillText('SUPER RUN',W/2,80);
    ctx.fillStyle='#fff';
    ctx.font='bold 16px Arial, sans-serif';
    ctx.fillText('WEB EDITION',W/2,105);
    ctx.shadowBlur=0;
    ctx.shadowOffsetX=0;
    ctx.shadowOffsetY=0;
    
    // 鏄剧ず鐜╁鍥剧墖
    if(playerImg.complete){
      ctx.drawImage(playerImg, W/2-20, 120, 40, 58);
    }
    
    ctx.fillStyle='#fff';
    ctx.font='bold 12px Arial, sans-serif';
    ctx.fillText('TAP TO START',W/2,200);
    ctx.fillText('\u70b9\u51fb\u5c4f\u5e55\u5f00\u59cb',W/2,218);
    ctx.textAlign='left';
    return;
  }
  drawBG();
  let startTx=Math.max(0,Math.floor(camX/T)-1);
  let endTx=Math.min(COLS-1,startTx+Math.ceil(W/T)+2);
  for(let tx=startTx;tx<=endTx;tx++) for(let ty=0;ty<ROWS;ty++) drawTile(tx,ty);
  enemies.forEach(e=>drawGoomba(e));
  particles.forEach(p=>{
    let px=Math.floor(p.x-camX),py=Math.floor(p.y);
    if(p.type==='coin'){
      ctx.fillStyle='#FFD700';
      ctx.beginPath();
      ctx.arc(px+6,py+6,6,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#FFA500';
      ctx.beginPath();
      ctx.arc(px+6,py+6,3,0,Math.PI*2);
      ctx.fill();
    }else{
      drawRoundRect(px,py,4,4,1,'#c84c0c');
    }
  });
  drawPlayer(player.x,player.y,player.dead);
  drawHUD();
  if(gameState==='dead'){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial, sans-serif';ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=4;
    ctx.fillText('GAME OVER',W/2,100);
    ctx.font='14px Arial, sans-serif';
    ctx.fillText('SCORE: '+score,W/2,130);
    ctx.fillText('TAP TO RETRY',W/2,160);
    ctx.shadowBlur=0;ctx.textAlign='left';
  }
  if(gameState==='win'){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#FFD700';ctx.font='bold 20px Arial, sans-serif';ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=4;
    ctx.fillText('COURSE CLEAR!',W/2,90);
    ctx.fillStyle='#fff';ctx.font='16px Arial, sans-serif';
    ctx.fillText('SCORE: '+score,W/2,120);
    ctx.fillText('COINS: '+coins,W/2,140);
    ctx.font='12px Arial, sans-serif';
    ctx.fillText('TAP TO PLAY AGAIN',W/2,175);
    ctx.shadowBlur=0;ctx.textAlign='left';
  }
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
